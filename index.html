<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Whack-a-Mole AR - Hoyos Limpios</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', cursive, sans-serif;
      background-color: #000000;
      color: #ffffff;
    }

    #webcam { display: none; }

    /* En AR, el DOM no debe pintar un fondo negro encima de la cámara real. */
    html.xr-active, body.xr-active {
      background: transparent !important;
      background-color: transparent !important;
    }
    body.xr-active #canvas-container,
    body.xr-active canvas {
      background: transparent !important;
    }
    body.xr-active .ui-layer {
      background: transparent !important;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: auto;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .interactive {
      pointer-events: auto;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 8px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .hud-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .hud-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #facc15;
    }

    .scan-banner {
      align-self: center;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 2px solid #22c55e;
      border-radius: 25px;
      padding: 12px 24px;
      color: #f0fdf4;
      font-size: 1rem;
      text-align: center;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
      animation: pulseBanner 2s infinite ease-in-out;
      margin-bottom: 20px;
    }

    @keyframes pulseBanner {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
      50% { transform: scale(1.03); box-shadow: 0 0 25px rgba(34, 197, 94, 0.7); }
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .modal-card {
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .btn-action {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
      width: 100%;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    .hidden {
      display: none !important;
    }

    .score-popup {
      position: absolute;
      font-size: 1.8rem;
      font-weight: 700;
      pointer-events: none;
      z-index: 15;
      animation: floatUp 0.8s forwards ease-out;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-layer">
    <div id="hud-header" class="hud-header hidden">
      <div class="hud-card">
        <div class="hud-title">PUNTOS</div>
        <div id="score-val" class="hud-value">0</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">NIVEL</div>
        <div id="level-val" class="hud-value" style="color: #38bdf8;">1</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">TIEMPO</div>
        <div id="time-val" class="hud-value" style="color: #f43f5e;">30s</div>
      </div>
    </div>

    <div id="scan-banner" class="scan-banner">
      📱 Pulsa “Iniciar AR” y mueve el teléfono para detectar una superficie
    </div>
  </div>

  <div id="gameover-modal" class="modal-overlay hidden interactive">
    <div class="modal-card">
      <h2 style="font-size: 1.8rem; color: #f8fafc; margin-bottom: 8px;">¡TIEMPO AGOTADO! ⏰</h2>
      <p style="color: #cbd5e1; font-size: 0.95rem; margin-bottom: 20px;">Atrapaste a los topos y esquivaste las bombas.</p>
      
      <div style="background: rgba(15, 23, 42, 0.6); padding: 16px; border-radius: 16px; margin-bottom: 20px;">
        <div style="font-size: 0.85rem; color: #94a3b8;">PUNTAJE FINAL</div>
        <div id="final-score" style="font-size: 2.5rem; font-weight: 700; color: #facc15;">0</div>
      </div>

      <button id="restart-btn" class="btn-action">Jugar de Nuevo</button>
    </div>
  </div>

  <script>
    class SoundFX {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }

      playPop() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playHit() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }

      playExplosion() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const bufferSize = this.ctx.sampleRate * 0.3;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, this.ctx.currentTime);
        filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }

      playLevelUp() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.2, now + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0, now + idx * 0.08 + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.1);
        });
      }
    }

    const sound = new SoundFX();

    let scene, camera, renderer, raycaster, mouse;
    let reticleMesh, isPlaced = false;
    let groundGroup;
    let hitTestSource = null;
    let hitTestSourceRequested = false;
    let surfaceFound = false;
    let controller;
    let xrSession = null;
    let holes = [];
    let activeElements = [];
    let score = 0, level = 1, timeLeft = 30;
    let gameActive = false, gameTimerInterval = null, spawnTimeout = null;

    const holePositions = [
      { x: -0.5, z: -0.3 }, { x: 0, z: -0.3 }, { x: 0.5, z: -0.3 },
      { x: -0.5, z: 0.3 },  { x: 0, z: 0.3 },  { x: 0.5, z: 0.3 }
    ];

    const virtualFloorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);

    init();

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 2.2, 2.2);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setClearColor(0x000000, 0);
      renderer.setClearAlpha(0);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      // Botón propio: se muestra siempre, incluso si ARButton de Three.js no detecta
      // WebXR a tiempo dentro del App Clip de Needle Go.
      const arButton = document.createElement('button');
      arButton.id = 'start-ar-btn';
      arButton.type = 'button';
      arButton.textContent = '📱 Iniciar realidad aumentada';
      arButton.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000;padding:14px 20px;border-radius:14px;border:0;background:#16a34a;color:white;font:700 16px Fredoka,cursive;box-shadow:0 5px 20px #0008;white-space:nowrap;';
      arButton.addEventListener('click', async () => {
        try {
          if (!navigator.xr || !navigator.xr.requestSession) {
            document.getElementById('scan-banner').classList.remove('hidden');
            document.getElementById('scan-banner').innerText = 'WebXR no está disponible. Abre este enlace desde Safari usando Needle Go.';
            return;
          }
          arButton.disabled = true;
          arButton.textContent = 'Iniciando AR…';
          // El fondo del documento debe ser transparente durante AR para no tapar el passthrough.
          renderer.xr.setReferenceSpaceType('local');
          const session = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['hit-test'],
            optionalFeatures: ['dom-overlay', 'local-floor'],
            domOverlay: { root: document.body }
          });
          await renderer.xr.setSession(session);
          arButton.style.display = 'none';
        } catch (error) {
          console.error('No se pudo iniciar AR:', error);
          document.getElementById('scan-banner').classList.remove('hidden');
          document.getElementById('scan-banner').innerText = 'No se pudo iniciar AR: ' + (error.message || error.name || 'error desconocido');
          arButton.disabled = false;
          arButton.textContent = '📱 Reintentar realidad aumentada';
        }
      });
      document.body.appendChild(arButton);

      renderer.xr.addEventListener('sessionstart', onXRSessionStart);
      renderer.xr.addEventListener('sessionend', onXRSessionEnd);
      controller = renderer.xr.getController(0);
      controller.addEventListener('select', onXRSelect);
      scene.add(controller);

      scene.add(new THREE.AmbientLight(0xffffff, 0.9));
      const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
      dirLight.position.set(2, 4, 3);
      scene.add(dirLight);

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      const ringGeo = new THREE.RingGeometry(0.25, 0.32, 32);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, side: THREE.DoubleSide });
      reticleMesh = new THREE.Mesh(ringGeo, ringMat);
      reticleMesh.rotation.x = -Math.PI / 2;
      reticleMesh.position.y = 0.01;
      scene.add(reticleMesh);

      buildEnvironment();

      window.addEventListener('resize', onWindowResize);
      // El juego se renderiza con el bucle XR para seguir la pose real del teléfono.
      renderer.setAnimationLoop(renderXRFrame);
      document.getElementById('restart-btn').addEventListener('click', resetPlacement);
    }

    // --- CONSTRUCCIÓN LIMPIA DEL TERRENO CON HOYOS DIRECTOS ---
    function buildEnvironment() {
      groundGroup = new THREE.Group();

      const baseGeo = new THREE.BoxGeometry(1.82, 0.1, 1.32);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x48bb78, roughness: 0.6 });
      const baseMesh = new THREE.Mesh(baseGeo, baseMat);
      baseMesh.position.y = -0.05;
      groundGroup.add(baseMesh);

      // Hoyos limpios con marco de tierra y fondo oscuro
      holePositions.forEach((pos, idx) => {
        const holeGroup = new THREE.Group();
        holeGroup.position.set(pos.x, 0, pos.z);

        // Borde plano del hoyo
        const ringGeo = new THREE.RingGeometry(0.14, 0.18, 32);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, side: THREE.DoubleSide });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.rotation.x = -Math.PI / 2;
        ringMesh.position.y = 0.002;
        holeGroup.add(ringMesh);

        // Fondo oscuro del hoyo
        const innerGeo = new THREE.CircleGeometry(0.14, 32);
        const innerMat = new THREE.MeshBasicMaterial({ color: 0x0f0a06 });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        innerMesh.rotation.x = -Math.PI / 2;
        innerMesh.position.y = 0.001;
        holeGroup.add(innerMesh);

        groundGroup.add(holeGroup);
        holes.push({ group: holeGroup, active: idx < 3 });
        if (idx >= 3) holeGroup.visible = false;
      });

      groundGroup.visible = false;
      scene.add(groundGroup);
    }

    function createMoleMesh() {
      const moleGroup = new THREE.Group();

      const bodyGeo = new THREE.SphereGeometry(0.13, 32, 24);
      bodyGeo.scale(1, 1.15, 0.95);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x8b5a2b, roughness: 0.6 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.13;
      moleGroup.add(body);

      const snoutGeo = new THREE.SphereGeometry(0.065, 20, 16);
      snoutGeo.scale(1, 0.75, 1.2);
      const snoutMat = new THREE.MeshStandardMaterial({ color: 0xf5e0c3, roughness: 0.5 });
      const snout = new THREE.Mesh(snoutGeo, snoutMat);
      snout.position.set(0, 0.11, 0.075);
      moleGroup.add(snout);

      const noseGeo = new THREE.SphereGeometry(0.022, 14, 14);
      const noseMat = new THREE.MeshStandardMaterial({ color: 0xf48fb1, roughness: 0.3 });
      const nose = new THREE.Mesh(noseGeo, noseMat);
      nose.position.set(0, 0.13, 0.14);
      moleGroup.add(nose);

      const eyeGeo = new THREE.SphereGeometry(0.018, 14, 14);
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x111111 });

      const eyeL = new THREE.Mesh(eyeGeo, eyeMat);
      eyeL.position.set(-0.045, 0.17, 0.095);
      moleGroup.add(eyeL);

      const eyeR = new THREE.Mesh(eyeGeo, eyeMat);
      eyeR.position.set(0.045, 0.17, 0.095);
      moleGroup.add(eyeR);

      const shineGeo = new THREE.SphereGeometry(0.006, 8, 8);
      const shineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

      const shineL = new THREE.Mesh(shineGeo, shineMat);
      shineL.position.set(-0.042, 0.176, 0.11);
      moleGroup.add(shineL);

      const shineR = new THREE.Mesh(shineGeo, shineMat);
      shineR.position.set(0.048, 0.176, 0.11);
      moleGroup.add(shineR);

      const cheekGeo = new THREE.SphereGeometry(0.018, 12, 12);
      const cheekMat = new THREE.MeshBasicMaterial({ color: 0xf472b6, transparent: true, opacity: 0.55 });

      const cheekL = new THREE.Mesh(cheekGeo, cheekMat);
      cheekL.position.set(-0.07, 0.13, 0.09);
      moleGroup.add(cheekL);

      const cheekR = new THREE.Mesh(cheekGeo, cheekMat);
      cheekR.position.set(0.07, 0.13, 0.09);
      moleGroup.add(cheekR);

      const helmetGeo = new THREE.SphereGeometry(0.12, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2.2);
      const helmetMat = new THREE.MeshStandardMaterial({ color: 0xfacc15, roughness: 0.3, metalness: 0.2 });
      const helmet = new THREE.Mesh(helmetGeo, helmetMat);
      helmet.position.set(0, 0.13, 0);
      helmet.rotation.x = -0.15;
      moleGroup.add(helmet);

      const handGeo = new THREE.SphereGeometry(0.03, 12, 12);
      handGeo.scale(1.2, 0.6, 1);
      const handMat = new THREE.MeshStandardMaterial({ color: 0xf5e0c3, roughness: 0.6 });

      const handL = new THREE.Mesh(handGeo, handMat);
      handL.position.set(-0.1, 0.04, 0.08);
      moleGroup.add(handL);

      const handR = new THREE.Mesh(handGeo, handMat);
      handR.position.set(0.1, 0.04, 0.08);
      moleGroup.add(handR);

      moleGroup.position.y = -0.35;
      return moleGroup;
    }

    function createBombMesh() {
      const bombGroup = new THREE.Group();
      
      const bodyGeo = new THREE.SphereGeometry(0.12, 24, 24);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.2, metalness: 0.6 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.12;
      bombGroup.add(body);

      const fuseGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.07);
      const fuseMat = new THREE.MeshBasicMaterial({ color: 0xd4a373 });
      const fuse = new THREE.Mesh(fuseGeo, fuseMat);
      fuse.position.set(0, 0.24, 0);
      fuse.rotation.z = 0.25;
      bombGroup.add(fuse);

      const sparkGeo = new THREE.SphereGeometry(0.022, 8, 8);
      const sparkMat = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
      const spark = new THREE.Mesh(sparkGeo, sparkMat);
      spark.position.set(0.02, 0.28, 0);
      bombGroup.add(spark);

      bombGroup.position.y = -0.35;
      return bombGroup;
    }

    function onXRSessionStart() {
      document.documentElement.classList.add('xr-active');
      document.body.classList.add('xr-active');
      xrSession = renderer.xr.getSession();
      hitTestSourceRequested = false;
      hitTestSource = null;
      surfaceFound = false;
      isPlaced = false;
      reticleMesh.visible = true;
      groundGroup.visible = false;
      document.getElementById('scan-banner').classList.remove('hidden');
      document.getElementById('scan-banner').innerText = 'Mueve lentamente el teléfono para detectar una superficie';
    }

    function onXRSessionEnd() {
      document.documentElement.classList.remove('xr-active');
      document.body.classList.remove('xr-active');
      xrSession = null;
      hitTestSource = null;
      hitTestSourceRequested = false;
      surfaceFound = false;
      isPlaced = false;
      gameActive = false;
      clearInterval(gameTimerInterval);
      clearTimeout(spawnTimeout);
      reticleMesh.visible = true;
      groundGroup.visible = false;
      document.getElementById('hud-header').classList.add('hidden');
      document.getElementById('scan-banner').classList.remove('hidden');
      document.getElementById('scan-banner').innerText = 'Pulsa “Iniciar AR” para volver a jugar';
    }

    function onXRSelect() {
      if (!surfaceFound) {
        document.getElementById('scan-banner').innerText = 'No detecto una superficie todavía. Apunta al piso o a una mesa y mueve el teléfono.';
        return;
      }

      if (!isPlaced) {
        // Copia la pose detectada por hit-test: el tablero queda en coordenadas del mundo XR.
        reticleMesh.updateMatrixWorld(true);
        reticleMesh.matrix.decompose(groundGroup.position, groundGroup.quaternion, groundGroup.scale);
        groundGroup.visible = true;
        reticleMesh.visible = false;
        isPlaced = true;
        document.getElementById('scan-banner').classList.add('hidden');
        document.getElementById('hud-header').classList.remove('hidden');
        startGame();
        return;
      }

      if (!gameActive) return;
      raycaster.setFromXRController(controller);
      const intersects = raycaster.intersectObjects(activeElements.map(el => el.mesh), true);
      if (!intersects.length) return;

      let hitObject = intersects[0].object;
      while (hitObject.parent && hitObject.parent !== groundGroup) hitObject = hitObject.parent;
      const elementIdx = activeElements.findIndex(el => el.mesh === hitObject);
      if (elementIdx === -1) return;

      const el = activeElements[elementIdx];
      if (el.type === 'mole') {
        sound.playHit();
        score += 100;
        checkLevelProgress();
      } else {
        sound.playExplosion();
        score = Math.max(0, score - 150);
        timeLeft = Math.max(0, timeLeft - 3);
      }
      document.getElementById('score-val').innerText = score;
      document.getElementById('time-val').innerText = `${timeLeft}s`;
      groundGroup.remove(el.mesh);
      activeElements.splice(elementIdx, 1);
      if (timeLeft <= 0) endGame();
    }

    function renderXRFrame(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();
        const referenceSpace = renderer.xr.getReferenceSpace();
        if (session && referenceSpace) {
          // Si falla la creación del hit-test, se vuelve a intentar en el siguiente frame.
          if (!hitTestSource && !hitTestSourceRequested) {
            hitTestSourceRequested = true;
            session.requestReferenceSpace('viewer')
              .then(viewerSpace => session.requestHitTestSource({ space: viewerSpace }))
              .then(source => {
                hitTestSource = source;
                console.info('[Topitos AR] Hit-test listo.');
              })
              .catch(err => {
                console.error('[Topitos AR] No se pudo crear hit-test:', err);
                hitTestSourceRequested = false;
                const banner = document.getElementById('scan-banner');
                banner.classList.remove('hidden');
                banner.innerText = 'No pude activar la detección de superficies. Mueve el teléfono y vuelve a intentar.';
              });
          }

          if (hitTestSource) {
            try {
              const results = frame.getHitTestResults(hitTestSource);
              if (results.length > 0) {
                const pose = results[0].getPose(referenceSpace);
                if (pose) {
                  reticleMesh.visible = !isPlaced;
                  reticleMesh.matrix.fromArray(pose.transform.matrix);
                  reticleMesh.matrix.decompose(reticleMesh.position, reticleMesh.quaternion, reticleMesh.scale);
                  reticleMesh.updateMatrixWorld(true);
                  surfaceFound = true;
                  if (!isPlaced) {
                    const banner = document.getElementById('scan-banner');
                    banner.classList.remove('hidden');
                    banner.innerText = '✅ Superficie detectada. Toca la pantalla para colocar el tablero';
                  }
                }
              } else {
                surfaceFound = false;
                if (!isPlaced) {
                  reticleMesh.visible = false;
                  const banner = document.getElementById('scan-banner');
                  banner.classList.remove('hidden');
                  banner.innerText = 'Busca el piso o una mesa con buena luz y mueve lentamente el teléfono';
                }
              }
            } catch (err) {
              console.error('[Topitos AR] Error leyendo hit-test:', err);
              hitTestSource = null;
              hitTestSourceRequested = false;
              surfaceFound = false;
            }
          }
        }
      }

      // Animación de aparición y desaparición de topos/bombas.
      for (let index = activeElements.length - 1; index >= 0; index--) {
        const el = activeElements[index];
        if (el.state === 'rising') {
          el.progress += 0.08;
          el.mesh.position.y = THREE.MathUtils.lerp(-0.35, 0, Math.min(el.progress, 1));
          if (el.progress >= 1) {
            el.state = 'waiting';
            setTimeout(() => {
              if (activeElements.includes(el) && el.state === 'waiting') { el.state = 'lowering'; el.progress = 0; }
            }, Math.max(250, 1000 - level * 100));
          }
        } else if (el.state === 'lowering') {
          el.progress += 0.08;
          el.mesh.position.y = THREE.MathUtils.lerp(0, -0.35, Math.min(el.progress, 1));
          if (el.progress >= 1) {
            groundGroup.remove(el.mesh);
            activeElements.splice(index, 1);
          }
        }
      }
      renderer.setClearColor(0x000000, 0);
      renderer.render(scene, camera);
    }

    function startGame() {
      score = 0; level = 1; timeLeft = 30; gameActive = true;

      document.getElementById('score-val').innerText = score;
      document.getElementById('level-val').innerText = level;
      document.getElementById('time-val').innerText = `${timeLeft}s`;
      document.getElementById('gameover-modal').classList.add('hidden');

      holes.forEach((h, idx) => {
        h.active = idx < 3;
        h.group.visible = idx < 3;
      });

      activeElements.forEach(el => groundGroup.remove(el.mesh));
      activeElements = [];

      clearInterval(gameTimerInterval);
      gameTimerInterval = setInterval(() => {
        if (!gameActive) return;
        timeLeft--;
        document.getElementById('time-val').innerText = `${timeLeft}s`;
        if (timeLeft <= 0) endGame();
      }, 1000);

      scheduleNextSpawn();
    }

    function scheduleNextSpawn() {
      if (!gameActive) return;
      const delay = Math.max(600, 1500 - level * 150);
      spawnTimeout = setTimeout(() => {
        spawnElement();
        scheduleNextSpawn();
      }, delay);
    }

    function spawnElement() {
      const availableHoles = holes
        .map((h, idx) => ({ h, idx }))
        .filter(item => item.h.active && !activeElements.some(el => el.holeIdx === item.idx));

      if (availableHoles.length === 0) return;

      const selected = availableHoles[Math.floor(Math.random() * availableHoles.length)];
      const isBomb = Math.random() < 0.25;

      const mesh = isBomb ? createBombMesh() : createMoleMesh();
      const pos = holePositions[selected.idx];
      mesh.position.set(pos.x, -0.35, pos.z);
      groundGroup.add(mesh);

      sound.playPop();

      activeElements.push({
        mesh: mesh,
        type: isBomb ? 'bomb' : 'mole',
        holeIdx: selected.idx,
        state: 'rising',
        progress: 0
      });
    }

    function checkLevelProgress() {
      const newLevel = Math.floor(score / 400) + 1;
      if (newLevel > level && newLevel <= 4) {
        level = newLevel;
        document.getElementById('level-val').innerText = level;
        sound.playLevelUp();

        const inactiveHole = holes.find(h => !h.active);
        if (inactiveHole) {
          inactiveHole.active = true;
          inactiveHole.group.visible = true;
        }
      }
    }

    function resetPlacement() {
      gameActive = false;
      clearInterval(gameTimerInterval);
      clearTimeout(spawnTimeout);
      activeElements.forEach(el => groundGroup.remove(el.mesh));
      activeElements = [];
      isPlaced = false;
      groundGroup.visible = false;
      reticleMesh.visible = true;
      document.getElementById('gameover-modal').classList.add('hidden');
      document.getElementById('hud-header').classList.add('hidden');
      document.getElementById('scan-banner').classList.remove('hidden');
    }

    function showPopup(text, x, y, color) {
      const pop = document.createElement('div');
      pop.className = 'score-popup';
      pop.innerText = text;
      pop.style.left = `${x - 20}px`;
      pop.style.top = `${y - 20}px`;
      pop.style.color = color;
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 800);
    }

    function endGame() {
      gameActive = false;
      clearInterval(gameTimerInterval);
      clearTimeout(spawnTimeout);

      document.getElementById('final-score').innerText = score;
      document.getElementById('gameover-modal').classList.remove('hidden');
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
