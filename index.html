<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Whack-a-Mole WebXR AR</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', cursive, sans-serif;
      background-color: #000000;
      color: #ffffff;
    }

    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .interactive {
      pointer-events: auto;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .hud-card {
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 8px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }

    .hud-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .hud-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #facc15;
    }

    .scan-banner {
      align-self: center;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 2px solid #22c55e;
      border-radius: 25px;
      padding: 12px 24px;
      color: #f0fdf4;
      font-size: 1rem;
      text-align: center;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
      animation: pulseBanner 2s infinite ease-in-out;
      margin-bottom: 70px;
    }

    @keyframes pulseBanner {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
      50% { transform: scale(1.03); box-shadow: 0 0 25px rgba(34, 197, 94, 0.7); }
    }

    #ar-button {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: #22c55e;
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-family: 'Fredoka', sans-serif;
      font-weight: 700;
      border-radius: 30px;
      box-shadow: 0 4px 15px rgba(34, 197, 94, 0.5);
      cursor: pointer;
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 20;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .modal-card {
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .btn-action {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
      width: 100%;
    }

    .hidden {
      display: none !important;
    }
  </style>

  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <button id="ar-button" class="interactive">INICIAR CÁMARA AR 📱</button>

  <div class="ui-layer">
    <div id="hud-header" class="hud-header hidden">
      <div class="hud-card">
        <div class="hud-title">PUNTOS</div>
        <div id="score-val" class="hud-value">0</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">NIVEL</div>
        <div id="level-val" class="hud-value" style="color: #38bdf8;">1</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">TIEMPO</div>
        <div id="time-val" class="hud-value" style="color: #f43f5e;">30s</div>
      </div>
    </div>

    <div id="scan-banner" class="scan-banner hidden">
      📍 Mueve tu teléfono para detectar la mesa/suelo y TOCA LA PANTALLA para anclar
    </div>
  </div>

  <div id="gameover-modal" class="modal-overlay hidden interactive">
    <div class="modal-card">
      <h2 style="font-size: 1.8rem; color: #f8fafc; margin-bottom: 8px;">¡TIEMPO AGOTADO! ⏰</h2>
      <p style="color: #cbd5e1; font-size: 0.95rem; margin-bottom: 20px;">Atrapaste los topos y esquivaste las bombas en tu entorno.</p>
      
      <div style="background: rgba(15, 23, 42, 0.6); padding: 16px; border-radius: 16px; margin-bottom: 20px;">
        <div style="font-size: 0.85rem; color: #94a3b8;">PUNTAJE FINAL</div>
        <div id="final-score" style="font-size: 2.5rem; font-weight: 700; color: #facc15;">0</div>
      </div>

      <button id="restart-btn" class="btn-action">Jugar de Nuevo</button>
    </div>
  </div>

  <script>
    class SoundFX {
      constructor() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      }

      playPop() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playHit() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(40, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }

      playExplosion() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const bufferSize = this.ctx.sampleRate * 0.3;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, this.ctx.currentTime);
        filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }

      playLevelUp() {
        if (this.ctx.state === 'suspended') this.ctx.resume();
        const now = this.ctx.currentTime;
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.2, now + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0, now + idx * 0.08 + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.1);
        });
      }
    }

    const sound = new SoundFX();

    let container, scene, camera, renderer;
    let reticle, hitTestSource = null, hitTestSourceRequested = false;
    let groundGroup;
    let holes = [];
    let activeElements = [];
    let isPlaced = false;

    let score = 0, level = 1, timeLeft = 30;
    let gameActive = false, gameTimerInterval = null, spawnTimeout = null;

    const holePositions = [
      { x: -0.5, z: -0.3 }, { x: 0, z: -0.3 }, { x: 0.5, z: -0.3 },
      { x: -0.5, z: 0.3 },  { x: 0, z: 0.3 },  { x: 0.5, z: 0.3 }
    ];

    init();

    function init() {
      container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
      dirLight.position.set(2, 4, 2);
      scene.add(dirLight);

      // Anillo verde para detección de planos
      const ringGeo = new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2);
      const ringMat = new THREE.MeshBasicMaterial({ color: 0x22c55e, side: THREE.DoubleSide });
      reticle = new THREE.Mesh(ringGeo, ringMat);
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      buildEnvironment();

      const controller = renderer.xr.getController(0);
      controller.addEventListener('select', onSelect);
      scene.add(controller);

      document.getElementById('ar-button').addEventListener('click', onARButtonClick);
      document.getElementById('restart-btn').addEventListener('click', startGame);
      window.addEventListener('resize', onWindowResize);

      renderer.setAnimationLoop(render);
    }

    async function onARButtonClick() {
      if (navigator.xr) {
        try {
          const session = await navigator.xr.requestSession('immersive-ar', {
            requiredFeatures: ['hit-test']
          });
          renderer.xr.setSession(session);
          document.getElementById('ar-button').style.display = 'none';
        } catch (e) {
          alert("WebXR AR no está soportado o requiere HTTPS en tu celular.");
        }
      } else {
        alert("Tu navegador no soporta WebXR. Intenta desde Chrome móvil.");
      }
    }

    function buildEnvironment() {
      groundGroup = new THREE.Group();

      const baseGeo = new THREE.BoxGeometry(1.8, 0.1, 1.3);
      const baseMat = new THREE.MeshStandardMaterial({ color: 0x4da63b, roughness: 0.8 });
      const baseMesh = new THREE.Mesh(baseGeo, baseMat);
      baseMesh.position.y = -0.05;
      groundGroup.add(baseMesh);

      holePositions.forEach((pos, idx) => {
        const holeGroup = new THREE.Group();
        holeGroup.position.set(pos.x, 0, pos.z);

        const ringGeo = new THREE.RingGeometry(0.14, 0.2, 32).rotateX(-Math.PI / 2);
        const ringMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, side: THREE.DoubleSide });
        const ringMesh = new THREE.Mesh(ringGeo, ringMat);
        ringMesh.position.y = 0.002;
        holeGroup.add(ringMesh);

        const innerGeo = new THREE.CircleGeometry(0.14, 32).rotateX(-Math.PI / 2);
        const innerMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
        const innerMesh = new THREE.Mesh(innerGeo, innerMat);
        innerMesh.position.y = 0.001;
        holeGroup.add(innerMesh);

        groundGroup.add(holeGroup);
        holes.push({ group: holeGroup, active: idx < 3 });
        if (idx >= 3) holeGroup.visible = false;
      });

      groundGroup.visible = false;
      scene.add(groundGroup);
    }

    function createMoleMesh() {
      const moleGroup = new THREE.Group();

      const bodyGeo = new THREE.SphereGeometry(0.12, 24, 16);
      bodyGeo.scale(1, 1.3, 1);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x6e473b, roughness: 0.9 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.12;
      moleGroup.add(body);

      const snoutGeo = new THREE.SphereGeometry(0.06, 16, 12);
      snoutGeo.scale(1, 0.7, 1.2);
      const snoutMat = new THREE.MeshStandardMaterial({ color: 0xd9b99b, roughness: 0.8 });
      const snout = new THREE.Mesh(snoutGeo, snoutMat);
      snout.position.set(0, 0.13, 0.08);
      moleGroup.add(snout);

      const noseGeo = new THREE.SphereGeometry(0.02, 12, 12);
      const noseMat = new THREE.MeshStandardMaterial({ color: 0xe88288 });
      const nose = new THREE.Mesh(noseGeo, noseMat);
      nose.position.set(0, 0.14, 0.14);
      moleGroup.add(nose);

      moleGroup.position.y = -0.3;
      return moleGroup;
    }

    function createBombMesh() {
      const bombGroup = new THREE.Group();

      const bodyGeo = new THREE.SphereGeometry(0.11, 24, 24);
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.3, metalness: 0.5 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.position.y = 0.11;
      bombGroup.add(body);

      const fuseGeo = new THREE.CylinderGeometry(0.008, 0.008, 0.06);
      const fuseMat = new THREE.MeshBasicMaterial({ color: 0xd4a373 });
      const fuse = new THREE.Mesh(fuseGeo, fuseMat);
      fuse.position.set(0, 0.22, 0);
      bombGroup.add(fuse);

      bombGroup.position.y = -0.3;
      return bombGroup;
    }

    function onSelect() {
      if (!isPlaced && reticle.visible) {
        groundGroup.position.setFromMatrixPosition(reticle.matrix);
        groundGroup.quaternion.setFromRotationMatrix(reticle.matrix);
        groundGroup.visible = true;
        reticle.visible = false;
        isPlaced = true;

        document.getElementById('scan-banner').classList.add('hidden');
        document.getElementById('hud-header').classList.remove('hidden');

        startGame();
      } else if (gameActive) {
        const controller = renderer.xr.getController(0);
        const tempMatrix = new THREE.Matrix4();
        tempMatrix.identity().extractRotation(controller.matrixWorld);

        const raycaster = new THREE.Raycaster();
        raycaster.ray.origin.setFromMatrixPosition(controller.matrixWorld);
        raycaster.ray.direction.set(0, 0, -1).applyMatrix4(tempMatrix);

        const intersects = raycaster.intersectObjects(activeElements.map(el => el.mesh), true);

        if (intersects.length > 0) {
          let hitObject = intersects[0].object;
          while (hitObject.parent && hitObject.parent !== groundGroup) hitObject = hitObject.parent;

          const elementIdx = activeElements.findIndex(el => el.mesh === hitObject);
          if (elementIdx !== -1) {
            const el = activeElements[elementIdx];

            if (el.type === 'mole') {
              sound.playHit();
              score += 100;
              checkLevelProgress();
            } else {
              sound.playExplosion();
              score = Math.max(0, score - 150);
              timeLeft = Math.max(0, timeLeft - 3);
            }

            document.getElementById('score-val').innerText = score;
            document.getElementById('time-val').innerText = `${timeLeft}s`;

            groundGroup.remove(el.mesh);
            activeElements.splice(elementIdx, 1);
          }
        }
      }
    }

    function startGame() {
      score = 0; level = 1; timeLeft = 30; gameActive = true;

      document.getElementById('score-val').innerText = score;
      document.getElementById('level-val').innerText = level;
      document.getElementById('time-val').innerText = `${timeLeft}s`;
      document.getElementById('gameover-modal').classList.add('hidden');

      holes.forEach((h, idx) => {
        h.active = idx < 3;
        h.group.visible = idx < 3;
      });

      activeElements.forEach(el => groundGroup.remove(el.mesh));
      activeElements = [];

      clearInterval(gameTimerInterval);
      gameTimerInterval = setInterval(() => {
        if (!gameActive) return;
        timeLeft--;
        document.getElementById('time-val').innerText = `${timeLeft}s`;
        if (timeLeft <= 0) endGame();
      }, 1000);

      scheduleNextSpawn();
    }

    function scheduleNextSpawn() {
      if (!gameActive) return;
      const delay = Math.max(600, 1500 - level * 150);
      spawnTimeout = setTimeout(() => {
        spawnElement();
        scheduleNextSpawn();
      }, delay);
    }

    function spawnElement() {
      const availableHoles = holes
        .map((h, idx) => ({ h, idx }))
        .filter(item => item.h.active && !activeElements.some(el => el.holeIdx === item.idx));

      if (availableHoles.length === 0) return;

      const selected = availableHoles[Math.floor(Math.random() * availableHoles.length)];
      const isBomb = Math.random() < 0.25;

      const mesh = isBomb ? createBombMesh() : createMoleMesh();
      const pos = holePositions[selected.idx];
      mesh.position.set(pos.x, -0.3, pos.z);
      groundGroup.add(mesh);

      sound.playPop();

      activeElements.push({
        mesh: mesh,
        type: isBomb ? 'bomb' : 'mole',
        holeIdx: selected.idx,
        state: 'rising',
        progress: 0
      });
    }

    function checkLevelProgress() {
      const newLevel = Math.floor(score / 400) + 1;
      if (newLevel > level && newLevel <= 4) {
        level = newLevel;
        document.getElementById('level-val').innerText = level;
        sound.playLevelUp();

        const inactiveHole = holes.find(h => !h.active);
        if (inactiveHole) {
          inactiveHole.active = true;
          inactiveHole.group.visible = true;
        }
      }
    }

    function endGame() {
      gameActive = false;
      clearInterval(gameTimerInterval);
      clearTimeout(spawnTimeout);

      document.getElementById('final-score').innerText = score;
      document.getElementById('gameover-modal').classList.remove('hidden');
    }

    function render(timestamp, frame) {
      if (frame) {
        const session = renderer.xr.getSession();

        if (!isPlaced) {
          document.getElementById('scan-banner').classList.remove('hidden');

          if (!hitTestSourceRequested) {
            session.requestReferenceSpace('viewer').then((referenceSpace) => {
              session.requestHitTestSource({ space: referenceSpace }).then((source) => {
                hitTestSource = source;
              });
            });

            session.addEventListener('end', () => {
              hitTestSourceRequested = false;
              hitTestSource = null;
            });

            hitTestSourceRequested = true;
          }

          if (hitTestSource) {
            const referenceSpace = renderer.xr.getReferenceSpace();
            const hitTestResults = frame.getHitTestResults(hitTestSource);

            if (hitTestResults.length > 0) {
              const hit = hitTestResults[0];
              reticle.visible = true;
              reticle.matrix.fromArray(hit.getPose(referenceSpace).transform.matrix);
            } else {
              reticle.visible = false;
            }
          }
        }

        activeElements.forEach((el, index) => {
          if (el.state === 'rising') {
            el.progress += 0.08;
            el.mesh.position.y = THREE.MathUtils.lerp(-0.3, 0, el.progress);
            if (el.progress >= 1) {
              el.state = 'waiting';
              setTimeout(() => { el.state = 'lowering'; el.progress = 0; }, 1000 - level * 100);
            }
          } else if (el.state === 'lowering') {
            el.progress += 0.08;
            el.mesh.position.y = THREE.MathUtils.lerp(0, -0.3, el.progress);
            if (el.progress >= 1) {
              groundGroup.remove(el.mesh);
              activeElements.splice(index, 1);
            }
          }
        });
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }
  </script>
</body>
</html>
