<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>Whack-a-Mole AR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
  body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Fredoka', cursive, sans-serif; background: #000; color: #fff; }
  html.xr-active, body.xr-active, body.xr-active #canvas-container, body.xr-active canvas, body.xr-active .ui-layer { background: transparent !important; }
  #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; z-index: 1; }
  .ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between; padding: 20px; }
  .hud-header { display: flex; justify-content: space-between; gap: 8px; }
  .hud-card { background: rgba(15,23,42,.85); border: 2px solid rgba(255,255,255,.2); border-radius: 16px; padding: 8px 14px; }
  .hud-title { font-size: .65rem; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; }
  .hud-value { font-size: 1.2rem; font-weight: 700; color: #facc15; }
  .scan-banner { align-self: center; background: rgba(15,23,42,.9); border: 2px solid #22c55e; border-radius: 25px; padding: 12px 24px; color: #f0fdf4; text-align: center; margin-bottom: 70px; }
  .modal-overlay { position: absolute; inset: 0; background: rgba(15,23,42,.85); z-index: 20; display: flex; justify-content: center; align-items: center; padding: 24px; }
  .modal-card { background: rgba(30,41,59,.95); border: 2px solid rgba(255,255,255,.2); border-radius: 28px; padding: 32px 24px; max-width: 360px; width: 100%; text-align: center; }
  .btn-action { background: linear-gradient(135deg,#22c55e,#16a34a); color: #fff; border: 0; padding: 14px 28px; font: 700 1.1rem Fredoka, sans-serif; border-radius: 20px; cursor: pointer; width: 100%; }
  .btn-action:active { transform: scale(.96); }
  .hidden { display: none !important; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>

<div class="ui-layer">
  <div id="hud-header" class="hud-header hidden">
    <div class="hud-card"><div class="hud-title">PUNTOS</div><div id="score-val" class="hud-value">0</div></div>
    <div class="hud-card"><div class="hud-title">NIVEL</div><div id="level-val" class="hud-value" style="color:#38bdf8">1</div></div>
    <div class="hud-card"><div class="hud-title">TIEMPO</div><div id="time-val" class="hud-value" style="color:#f43f5e">30s</div></div>
  </div>
  <div id="scan-banner" class="scan-banner">📱 Pulsa "Iniciar AR" y mueve el teléfono para detectar una superficie</div>
</div>

<div id="gameover-modal" class="modal-overlay hidden">
  <div class="modal-card">
    <h2 style="font-size:1.8rem;margin-bottom:8px">¡TIEMPO AGOTADO! ⏰</h2>
    <p style="color:#cbd5e1;margin-bottom:20px">Atrapaste a los topos y esquivaste las bombas.</p>
    <div style="background:rgba(15,23,42,.6);padding:16px;border-radius:16px;margin-bottom:20px">
      <div style="font-size:.85rem;color:#94a3b8">PUNTAJE FINAL</div>
      <div id="final-score" style="font-size:2.5rem;font-weight:700;color:#facc15">0</div>
    </div>
    <button id="restart-btn" class="btn-action">Jugar de nuevo</button>
    <button id="replace-btn" class="btn-action" style="margin-top:10px;background:#334155">Recolocar tablero</button>
  </div>
</div>

<script>
class SoundFX {
  constructor() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
  _tone(type, f0, f1, dur, vol, delay = 0) {
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f0, t);
    if (f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + dur);
  }
  playPop() { this._tone('sine', 300, 800, 0.08, 0.3); }
  playHit() { this._tone('triangle', 160, 40, 0.15, 0.5); }
  playLevelUp() { [440, 554.37, 659.25, 880].forEach((f, i) => this._tone('sine', f, f, 0.1, 0.2, i * 0.08)); }
  playExplosion() {
    if (this.ctx.state === 'suspended') this.ctx.resume();
    const n = this.ctx.sampleRate * 0.3, buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(), g = this.ctx.createGain(), t = this.ctx.currentTime;
    f.type = 'lowpass'; f.frequency.setValueAtTime(800, t); f.frequency.linearRampToValueAtTime(50, t + 0.3);
    g.gain.setValueAtTime(0.6, t); g.gain.linearRampToValueAtTime(0, t + 0.3);
    src.connect(f); f.connect(g); g.connect(this.ctx.destination); src.start();
  }
}
const sound = new SoundFX();

// Tamaño real del tablero en AR (1 = 1.8 m de ancho, demasiado grande para una mesa).
const BOARD_SCALE = 0.5;
// Enlace para abrir esta misma página dentro de Needle Go (solo funciona con una URL https pública).
const NEEDLE_GO_URL = () => 'https://appclip.needle.tools/ar?url=' + encodeURIComponent(window.location.href);

let scene, camera, renderer, raycaster, mouse, controller;
let reticleMesh, anchorGroup, groundGroup;
let isPlaced = false, placeRequested = false, surfaceFound = false, boardAnchor = null;
let hitTestSource = null, hitTestSourceRequested = false;
let fallbackMode = false;
let holes = [], activeElements = [];
let score = 0, level = 1, timeLeft = 30;
let gameActive = false, gameTimerInterval = null, spawnTimeout = null;

const holePositions = [
  { x: -0.5, z: -0.3 }, { x: 0, z: -0.3 }, { x: 0.5, z: -0.3 },
  { x: -0.5, z: 0.3 },  { x: 0, z: 0.3 },  { x: 0.5, z: 0.3 }
];
const $ = id => document.getElementById(id);
const setBanner = txt => { const b = $('scan-banner'); b.classList.remove('hidden'); b.innerText = txt; };

init();

function init() {
  scene = new THREE.Scene();
  // near = 0.01 para que el tablero no se recorte cuando estás cerca de él.
  camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.01, 100);
  camera.position.set(0, 2.2, 2.2);
  camera.lookAt(0, 0, 0);

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setClearColor(0x000000, 0);
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType('local');
  $('canvas-container').appendChild(renderer.domElement);

  const arButton = document.createElement('button');
  arButton.id = 'start-ar-btn';
  arButton.type = 'button';
  arButton.textContent = '📱 Iniciar realidad aumentada';
  arButton.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:1000;padding:14px 20px;border-radius:14px;border:0;background:#16a34a;color:#fff;font:700 16px Fredoka,sans-serif;white-space:nowrap;';
  arButton.addEventListener('click', async () => {
    if (!navigator.xr || !navigator.xr.requestSession) {
      window.location.href = NEEDLE_GO_URL(); // Safari de iPhone no tiene WebXR: abrir con Needle Go
      return;
    }
    try {
      arButton.disabled = true;
      arButton.textContent = 'Iniciando AR…';
      const session = await navigator.xr.requestSession('immersive-ar', {
        requiredFeatures: ['hit-test'],
        optionalFeatures: ['dom-overlay', 'local-floor', 'anchors'],
        domOverlay: { root: document.body }
      });
      await renderer.xr.setSession(session);
      arButton.style.display = 'none';
    } catch (error) {
      console.error('No se pudo iniciar AR:', error);
      setBanner('No se pudo iniciar AR: ' + (error.message || error.name || 'error desconocido'));
      arButton.disabled = false;
      arButton.textContent = '📱 Reintentar realidad aumentada';
    }
  });
  document.body.appendChild(arButton);

  renderer.xr.addEventListener('sessionstart', onXRSessionStart);
  renderer.xr.addEventListener('sessionend', onXRSessionEnd);
  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onXRSelect);
  scene.add(controller);

  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const dir = new THREE.DirectionalLight(0xfff5ea, 1.2);
  dir.position.set(2, 4, 3);
  scene.add(dir);

  raycaster = new THREE.Raycaster();
  mouse = new THREE.Vector2();

  // El anillo se rota en la geometría (no en el mesh) porque la pose del hit-test pisa la rotación del mesh.
  const ringGeo = new THREE.RingGeometry(0.15, 0.2, 32);
  ringGeo.rotateX(-Math.PI / 2);
  reticleMesh = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0x22c55e, side: THREE.DoubleSide }));
  reticleMesh.visible = false;
  // 🔧 FIX: desactivar frustum culling del reticle también (por seguridad)
  reticleMesh.frustumCulled = false;
  scene.add(reticleMesh);

  buildEnvironment();
  addEventListener('resize', onWindowResize);
  renderer.setAnimationLoop(renderXRFrame);

  $('restart-btn').addEventListener('click', () => { $('gameover-modal').classList.add('hidden'); startGame(); });
  $('replace-btn').addEventListener('click', () => { boardAnchor = null; placeRequested = false; resetPlacement(); });

  // Sin WebXR (Safari normal / escritorio) se juega en modo vista previa 3D.
  // Se espera un poco por si Needle Go inyecta navigator.xr con retraso.
  setTimeout(() => { if (!navigator.xr && !renderer.xr.isPresenting) startPreviewMode(arButton); }, 1500);
}

function buildEnvironment() {
  anchorGroup = new THREE.Group();   // lo mueve el anchor (o la pose del hit-test)
  groundGroup = new THREE.Group();   // escala y orientación del tablero
  groundGroup.scale.setScalar(BOARD_SCALE);

  const base = new THREE.Mesh(new THREE.BoxGeometry(1.82, 0.1, 1.32), new THREE.MeshStandardMaterial({ color: 0x48bb78, roughness: 0.6 }));
  base.position.y = -0.05;
  // 🔧 FIX: desactivar frustum culling del tablero para que no desaparezca al acercarse o moverse
  base.frustumCulled = false;
  groundGroup.add(base);

  holePositions.forEach((pos, idx) => {
    const hg = new THREE.Group();
    hg.position.set(pos.x, 0, pos.z);
    const ring = new THREE.Mesh(new THREE.RingGeometry(0.14, 0.18, 32), new THREE.MeshStandardMaterial({ color: 0x5c4033, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2; ring.position.y = 0.002;
    ring.frustumCulled = false; // 🔧 FIX
    const inner = new THREE.Mesh(new THREE.CircleGeometry(0.14, 32), new THREE.MeshBasicMaterial({ color: 0x0f0a06 }));
    inner.rotation.x = -Math.PI / 2; inner.position.y = 0.001;
    inner.frustumCulled = false; // 🔧 FIX
    hg.add(ring, inner);
    // 🔧 FIX: desactivar también en el grupo de cada hoyo
    hg.frustumCulled = false;
    groundGroup.add(hg);
    holes.push({ group: hg, active: idx < 3 });
    hg.visible = idx < 3;
  });

  groundGroup.visible = false;
  groundGroup.frustumCulled = false; // 🔧 FIX
  anchorGroup.add(groundGroup);
  scene.add(anchorGroup);
}

function createMoleMesh() {
  const g = new THREE.Group();
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.frustumCulled = false; g.add(m); return m; };
  const std = (c, r = 0.6, ex = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: r, ...ex });
  const basic = (c, ex = {}) => new THREE.MeshBasicMaterial({ color: c, ...ex });
  const sph = (r, sx = 1, sy = 1, sz = 1, w = 16, h = 12) => { const geo = new THREE.SphereGeometry(r, w, h); geo.scale(sx, sy, sz); return geo; };

  add(sph(0.13, 1, 1.15, 0.95, 32, 24), std(0x8b5a2b), 0, 0.13, 0);
  add(sph(0.065, 1, 0.75, 1.2, 20, 16), std(0xf5e0c3, 0.5), 0, 0.11, 0.075);
  add(sph(0.022, 1, 1, 1, 14, 14), std(0xf48fb1, 0.3), 0, 0.13, 0.14);
  const eye = sph(0.018, 1, 1, 1, 14, 14), eyeM = basic(0x111111);
  add(eye, eyeM, -0.045, 0.17, 0.095); add(eye, eyeM, 0.045, 0.17, 0.095);
  const shine = sph(0.006, 1, 1, 1, 8, 8), shineM = basic(0xffffff);
  add(shine, shineM, -0.042, 0.176, 0.11); add(shine, shineM, 0.048, 0.176, 0.11);
  const cheek = sph(0.018, 1, 1, 1, 12, 12), cheekM = basic(0xf472b6, { transparent: true, opacity: 0.55 });
  add(cheek, cheekM, -0.07, 0.13, 0.09); add(cheek, cheekM, 0.07, 0.13, 0.09);
  const helmet = add(new THREE.SphereGeometry(0.12, 24, 16, 0, Math.PI * 2, 0, Math.PI / 2.2), std(0xfacc15, 0.3, { metalness: 0.2 }), 0, 0.13, 0);
  helmet.rotation.x = -0.15;
  const hand = sph(0.03, 1.2, 0.6, 1, 12, 12), handM = std(0xf5e0c3);
  add(hand, handM, -0.1, 0.04, 0.08); add(hand, handM, 0.1, 0.04, 0.08);

  g.position.y = -0.35;
  g.frustumCulled = false; // 🔧 FIX
  return g;
}

function createBombMesh() {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.12, 24, 24), new THREE.MeshStandardMaterial({ color: 0x111827, roughness: 0.2, metalness: 0.6 }));
  body.position.y = 0.12; body.frustumCulled = false; // 🔧 FIX
  const fuse = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.07), new THREE.MeshBasicMaterial({ color: 0xd4a373 }));
  fuse.position.set(0, 0.24, 0); fuse.rotation.z = 0.25; fuse.frustumCulled = false; // 🔧 FIX
  const spark = new THREE.Mesh(new THREE.SphereGeometry(0.022, 8, 8), new THREE.MeshBasicMaterial({ color: 0xf59e0b }));
  spark.position.set(0.02, 0.28, 0); spark.frustumCulled = false; // 🔧 FIX
  g.add(body, fuse, spark);
  g.position.y = -0.35;
  g.frustumCulled = false; // 🔧 FIX
  return g;
}

// ---------- Modo vista previa (sin WebXR) ----------
function startPreviewMode(arButton) {
  fallbackMode = true;
  arButton.textContent = '📱 Abrir en Needle Go (AR en iPhone)';
  scene.background = new THREE.Color(0x1e293b);
  // 🔧 FIX: no agrandar el tablero en preview; mantener BOARD_SCALE
  groundGroup.scale.setScalar(BOARD_SCALE);
  groundGroup.visible = true;
  isPlaced = true;
  $('scan-banner').classList.add('hidden');
  $('hud-header').classList.remove('hidden');
  $('replace-btn').classList.add('hidden');
  renderer.domElement.addEventListener('pointerdown', onPreviewPointer);
  startGame();
}

function leavePreviewMode() {
  if (!fallbackMode) return;
  fallbackMode = false;
  stopGame();
  scene.background = null;
  groundGroup.scale.setScalar(BOARD_SCALE);
  $('gameover-modal').classList.add('hidden');
  $('replace-btn').classList.remove('hidden');
  renderer.domElement.removeEventListener('pointerdown', onPreviewPointer);
}

function onPreviewPointer(e) {
  if (!gameActive) return;
  mouse.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(mouse, camera);
  tryWhack();
}

// ---------- Sesión XR ----------
function onXRSessionStart() {
  leavePreviewMode();
  document.documentElement.classList.add('xr-active');
  document.body.classList.add('xr-active');
  hitTestSource = null; hitTestSourceRequested = false;
  surfaceFound = false; isPlaced = false; placeRequested = false; boardAnchor = null;
  reticleMesh.visible = false;
  groundGroup.visible = false;
  stopGame();
  $('hud-header').classList.add('hidden');
  setBanner('Mueve lentamente el teléfono para detectar una superficie');
}

function onXRSessionEnd() {
  document.documentElement.classList.remove('xr-active');
  document.body.classList.remove('xr-active');
  hitTestSource = null; hitTestSourceRequested = false;
  surfaceFound = false; isPlaced = false; placeRequested = false; boardAnchor = null;
  stopGame();
  reticleMesh.visible = false;
  groundGroup.visible = false;
  $('hud-header').classList.add('hidden');
  $('gameover-modal').classList.add('hidden');
  setBanner('Pulsa "Iniciar AR" para volver a jugar');
  const b = $('start-ar-btn');
  b.style.display = ''; b.disabled = false; b.textContent = '📱 Iniciar realidad aumentada';
}

function onXRSelect() {
  if (!isPlaced) {
    // La colocación real ocurre en el siguiente frame XR (createAnchor necesita un frame activo).
    if (surfaceFound) placeRequested = true;
    else setBanner('No detecto una superficie todavía. Apunta al piso o a una mesa y mueve el teléfono.');
    return;
  }
  if (!gameActive) return;
  raycaster.setFromXRController(controller);
  tryWhack();
}

function placeBoard(frame, referenceSpace, result, pose) {
  placeRequested = false;
  const pos = new THREE.Vector3(), q0 = new THREE.Quaternion(), s = new THREE.Vector3();
  new THREE.Matrix4().fromArray(pose.transform.matrix).decompose(pos, q0, s);

  // Girar el tablero para que quede de frente al jugador (los topos miran hacia +Z).
  const viewer = frame.getViewerPose(referenceSpace);
  let yaw = 0;
  if (viewer) {
    const p = viewer.transform.position;
    yaw = Math.atan2(p.x - pos.x, p.z - pos.z);
  }
  const qWorld = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), yaw);
  anchorGroup.position.copy(pos);
  anchorGroup.quaternion.copy(q0);
  groundGroup.quaternion.copy(q0.clone().invert().multiply(qWorld));

  // 🔧 FIX: NO dependemos de createAnchor porque en iOS/Needle Go no está disponible.
  // El tablero queda fijo en la pose del hit-test en el momento de colocación.
  // Si en el futuro el dispositivo soporta anchors, se usará automáticamente.
  boardAnchor = null;
  if (result.createAnchor) {
    result.createAnchor().then(a => { boardAnchor = a; console.info('[AR] Anchor creado correctamente'); })
      .catch(e => console.warn('[AR] Anchors no disponibles en este dispositivo (iOS/Needle Go):', e));
  }

  groundGroup.visible = true;
  reticleMesh.visible = false;
  isPlaced = true;
  $('scan-banner').classList.add('hidden');
  $('hud-header').classList.remove('hidden');
  startGame();
}

function updateXR(frame) {
  const session = renderer.xr.getSession();
  const referenceSpace = renderer.xr.getReferenceSpace();
  if (!session || !referenceSpace) return;

  if (!hitTestSource && !hitTestSourceRequested) {
    hitTestSourceRequested = true;
    session.requestReferenceSpace('viewer')
      .then(viewerSpace => session.requestHitTestSource({ space: viewerSpace }))
      .then(source => { hitTestSource = source; console.info('[AR] Hit-test listo'); })
      .catch(err => {
        console.error('[AR] No se pudo crear hit-test:', err);
        hitTestSourceRequested = false;
        setBanner('No pude activar la detección de superficies. Mueve el teléfono y vuelve a intentar.');
      });
  }

  if (isPlaced) {
    // 🔧 FIX: solo actualizamos la pose si el anchor existe de verdad.
    // En iOS boardAnchor será null y el tablero se queda donde lo colocaste.
    if (boardAnchor) {
      const p = frame.getPose(boardAnchor.anchorSpace, referenceSpace);
      if (p) {
        anchorGroup.matrix.fromArray(p.transform.matrix);
        anchorGroup.matrix.decompose(anchorGroup.position, anchorGroup.quaternion, anchorGroup.scale);
      }
    }
    return;
  }
  if (!hitTestSource) return;

  try {
    const results = frame.getHitTestResults(hitTestSource);
    const pose = results.length ? results[0].getPose(referenceSpace) : null;
    if (pose) {
      reticleMesh.visible = true;
      reticleMesh.matrix.fromArray(pose.transform.matrix);
      reticleMesh.matrix.decompose(reticleMesh.position, reticleMesh.quaternion, reticleMesh.scale);
      surfaceFound = true;
      setBanner('✅ Superficie detectada. Toca la pantalla para colocar el tablero');
      if (placeRequested) placeBoard(frame, referenceSpace, results[0], pose);
    } else {
      surfaceFound = false;
      reticleMesh.visible = false;
      setBanner('Busca el piso o una mesa con buena luz y mueve lentamente el teléfono');
    }
  } catch (err) {
    console.error('[AR] Error leyendo hit-test:', err);
    hitTestSource = null; hitTestSourceRequested = false; surfaceFound = false;
  }
}

function renderXRFrame(timestamp, frame) {
  if (frame) updateXR(frame);
  animateElements();
  renderer.render(scene, camera);
}

function animateElements() {
  for (let i = activeElements.length - 1; i >= 0; i--) {
    const el = activeElements[i];
    if (el.state === 'rising') {
      el.progress += 0.08;
      el.mesh.position.y = THREE.MathUtils.lerp(-0.35, 0, Math.min(el.progress, 1));
      if (el.progress >= 1) {
        el.state = 'waiting';
        setTimeout(() => {
          if (activeElements.includes(el) && el.state === 'waiting') { el.state = 'lowering'; el.progress = 0; }
        }, Math.max(250, 1000 - level * 100));
      }
    } else if (el.state === 'lowering') {
      el.progress += 0.08;
      el.mesh.position.y = THREE.MathUtils.lerp(0, -0.35, Math.min(el.progress, 1));
      if (el.progress >= 1) { groundGroup.remove(el.mesh); activeElements.splice(i, 1); }
    }
  }
}

// ---------- Juego ----------
function tryWhack() {
  const hits = raycaster.intersectObjects(activeElements.map(el => el.mesh), true);
  if (!hits.length) return;
  let obj = hits[0].object;
  while (obj.parent && obj.parent !== groundGroup) obj = obj.parent;
  const idx = activeElements.findIndex(el => el.mesh === obj);
  if (idx === -1) return;

  const el = activeElements[idx];
  if (el.type === 'mole') {
    sound.playHit(); score += 100; checkLevelProgress();
  } else {
    sound.playExplosion(); score = Math.max(0, score - 150); timeLeft = Math.max(0, timeLeft - 3);
  }
  $('score-val').innerText = score;
  $('time-val').innerText = `${timeLeft}s`;
  groundGroup.remove(el.mesh);
  activeElements.splice(idx, 1);
  if (timeLeft <= 0) endGame();
}

function stopGame() {
  gameActive = false;
  clearInterval(gameTimerInterval);
  clearTimeout(spawnTimeout);
  activeElements.forEach(el => groundGroup.remove(el.mesh));
  activeElements = [];
}

function startGame() {
  stopGame();
  score = 0; level = 1; timeLeft = 30; gameActive = true;
  $('score-val').innerText = score;
  $('level-val').innerText = level;
  $('time-val').innerText = `${timeLeft}s`;
  $('gameover-modal').classList.add('hidden');
  holes.forEach((h, i) => { h.active = i < 3; h.group.visible = i < 3; });

  gameTimerInterval = setInterval(() => {
    if (!gameActive) return;
    timeLeft--;
    $('time-val').innerText = `${timeLeft}s`;
    if (timeLeft <= 0) endGame();
  }, 1000);
  scheduleNextSpawn();
}

function scheduleNextSpawn() {
  if (!gameActive) return;
  spawnTimeout = setTimeout(() => { spawnElement(); scheduleNextSpawn(); }, Math.max(600, 1500 - level * 150));
}

function spawnElement() {
  const free = holes.map((h, idx) => ({ h, idx })).filter(o => o.h.active && !activeElements.some(el => el.holeIdx === o.idx));
  if (!free.length) return;
  const sel = free[Math.floor(Math.random() * free.length)];
  const isBomb = Math.random() < 0.25;
  const mesh = isBomb ? createBombMesh() : createMoleMesh();
  mesh.position.set(holePositions[sel.idx].x, -0.35, holePositions[sel.idx].z);
  groundGroup.add(mesh);
  sound.playPop();
  activeElements.push({ mesh, type: isBomb ? 'bomb' : 'mole', holeIdx: sel.idx, state: 'rising', progress: 0 });
}

function checkLevelProgress() {
  const newLevel = Math.floor(score / 400) + 1;
  if (newLevel > level && newLevel <= 4) {
    level = newLevel;
    $('level-val').innerText = level;
    sound.playLevelUp();
    const h = holes.find(h => !h.active);
    if (h) { h.active = true; h.group.visible = true; }
  }
}

function resetPlacement() {
  stopGame();
  isPlaced = false; surfaceFound = false;
  groundGroup.visible = false;
  $('gameover-modal').classList.add('hidden');
  $('hud-header').classList.add('hidden');
  setBanner('Mueve el teléfono y toca para colocar el tablero de nuevo');
}

function endGame() {
  gameActive = false;
  clearInterval(gameTimerInterval);
  clearTimeout(spawnTimeout);
  $('final-score').innerText = score;
  $('gameover-modal').classList.remove('hidden');
}

function onWindowResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
</script>
