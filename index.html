<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Whack-a-Mole AR - A-Frame & AR.js</title>

  <!-- Import A-Frame 1.4.0 -->
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <!-- Import AR.js for A-Frame -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Fredoka', cursive, sans-serif;
      background-color: #000000;
    }

    /* Ocultar elementos emergentes o logos de A-Frame */
    .a-enter-vr, .a-enter-ar {
      display: none !important;
    }

    /* Interfaz de Usuario Overlay */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px;
    }

    .interactive {
      pointer-events: auto;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .hud-card {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 8px 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      min-width: 80px;
      text-align: center;
    }

    .hud-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      color: #94a3b8;
      letter-spacing: 1px;
    }

    .hud-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: #facc15;
    }

    .scan-banner {
      align-self: center;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 2px solid #22c55e;
      border-radius: 25px;
      padding: 14px 24px;
      color: #f0fdf4;
      font-size: 1rem;
      text-align: center;
      box-shadow: 0 0 20px rgba(34, 197, 94, 0.5);
      animation: pulseBanner 2s infinite ease-in-out;
      margin-bottom: 30px;
      pointer-events: auto;
      cursor: pointer;
    }

    @keyframes pulseBanner {
      0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(34, 197, 94, 0.4); }
      50% { transform: scale(1.03); box-shadow: 0 0 25px rgba(34, 197, 94, 0.7); }
    }

    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 10000;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .modal-card {
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 28px;
      padding: 32px 24px;
      max-width: 360px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .btn-action {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #ffffff;
      border: none;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: 700;
      border-radius: 20px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.4);
      width: 100%;
    }

    .btn-action:active {
      transform: scale(0.96);
    }

    .hidden {
      display: none !important;
    }

    .score-popup {
      position: absolute;
      font-size: 1.8rem;
      font-weight: 700;
      pointer-events: none;
      z-index: 10001;
      animation: floatUp 0.8s forwards ease-out;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0) scale(0.8); }
      100% { opacity: 0; transform: translateY(-50px) scale(1.2); }
    }
  </style>
</head>
<body>

  <!-- Capa UI -->
  <div class="ui-layer">
    <div id="hud-header" class="hud-header hidden">
      <div class="hud-card">
        <div class="hud-title">PUNTOS</div>
        <div id="score-val" class="hud-value">0</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">NIVEL</div>
        <div id="level-val" class="hud-value" style="color: #38bdf8;">1</div>
      </div>
      <div class="hud-card">
        <div class="hud-title">TIEMPO</div>
        <div id="time-val" class="hud-value" style="color: #f43f5e;">30s</div>
      </div>
    </div>

    <div id="scan-banner" class="scan-banner">
      📍 Apunta con la cámara y TOCA LA PANTALLA para fijar el terreno de juego
    </div>
  </div>

  <!-- Modal Game Over -->
  <div id="gameover-modal" class="modal-overlay hidden interactive">
    <div class="modal-card">
      <h2 style="font-size: 1.8rem; color: #f8fafc; margin-bottom: 8px;">¡TIEMPO AGOTADO! ⏰</h2>
      <p style="color: #cbd5e1; font-size: 0.95rem; margin-bottom: 20px;">Atrapaste a los topos y esquivaste las bombas.</p>
      
      <div style="background: rgba(15, 23, 42, 0.6); padding: 16px; border-radius: 16px; margin-bottom: 20px;">
        <div style="font-size: 0.85rem; color: #94a3b8;">PUNTAJE FINAL</div>
        <div id="final-score" style="font-size: 2.5rem; font-weight: 700; color: #facc15;">0</div>
      </div>

      <button id="restart-btn" class="btn-action">Reubicar y Jugar de Nuevo</button>
    </div>
  </div>

  <!-- Escena A-Frame con AR.js -->
  <a-scene 
    embedded 
    arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;"
    renderer="precision: medium; antialias: true; alpha: true;"
    vr-mode-ui="enabled: false">

    <a-entity id="camera" camera look-controls raycaster="objects: .clickable" cursor="rayOrigin: mouse"></a-entity>

    <!-- Terreno Principal (Oculto hasta hacer Tap) -->
    <a-entity id="game-ground" position="0 -0.5 -1.8" visible="false">
      <!-- Base de Jardín Verde -->
      <a-box position="0 -0.05 0" width="1.8" height="0.1" depth="1.3" color="#48bb78" material="roughness: 0.6"></a-box>
    </a-entity>

  </a-scene>

  <script>
    // Sintetizador Web Audio API para Efectos de Sonido
    class SoundFX {
      constructor() {
        this.ctx = null;
      }

      initCtx() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playPop() {
        this.initCtx();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }

      playHit() {
        this.initCtx();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(50, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }

      playExplosion() {
        this.initCtx();
        const bufferSize = this.ctx.sampleRate * 0.3;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(800, this.ctx.currentTime);
        filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.3);
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.6, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 0.3);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }

      playLevelUp() {
        this.initCtx();
        const now = this.ctx.currentTime;
        [440, 554.37, 659.25, 880].forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.frequency.setValueAtTime(freq, now + idx * 0.08);
          gain.gain.setValueAtTime(0.2, now + idx * 0.08);
          gain.gain.linearRampToValueAtTime(0, now + idx * 0.08 + 0.1);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + idx * 0.08);
          osc.stop(now + idx * 0.08 + 0.1);
        });
      }
    }

    const sound = new SoundFX();

    // Estado del Juego
    let isPlaced = false;
    let gameActive = false;
    let score = 0;
    let level = 1;
    let timeLeft = 30;
    let gameTimerInterval = null;
    let spawnTimeout = null;

    const holePositions = [
      { x: -0.5, z: -0.3 }, { x: 0, z: -0.3 }, { x: 0.5, z: -0.3 },
      { x: -0.5, z: 0.3 },  { x: 0, z: 0.3 },  { x: 0.5, z: 0.3 }
    ];

    let holesEntities = [];
    let activeElements = [];

    window.addEventListener('DOMContentLoaded', () => {
      buildEnvironment();

      // Tap para fijar en el espacio 3D
      window.addEventListener('click', (e) => {
        // Evitar toques en modal o UI
        if (e.target.closest('.interactive') || e.target.closest('.scan-banner')) return;

        if (!isPlaced) {
          anchorGroundInFrontOfCamera();
        }
      });

      document.getElementById('restart-btn').addEventListener('click', resetPlacement);
    });

    // Ancla el terreno en la posición 3D real frente a la cámara en el momento del tap
    function anchorGroundInFrontOfCamera() {
      const groundEl = document.getElementById('game-ground');
      const cameraEl = document.getElementById('camera');

      // Obtener posición y dirección actual de la cámara
      const cameraObj = cameraEl.object3D;
      const worldPos = new THREE.Vector3();
      const worldDir = new THREE.Vector3();

      cameraObj.getWorldPosition(worldPos);
      cameraObj.getWorldDirection(worldDir);

      // Calcular la posición 1.5m adelante y 0.5m abajo en el espacio 3D real
      const targetPos = new THREE.Vector3()
        .copy(worldPos)
        .add(worldDir.multiplyScalar(-1.6));
      targetPos.y -= 0.4;

      groundEl.object3D.position.copy(targetPos);
      
      // Orientar el terreno hacia la cámara manteniendo el suelo plano
      groundEl.object3D.rotation.set(0, cameraObj.rotation.y, 0);

      groundEl.setAttribute('visible', 'true');
      isPlaced = true;

      document.getElementById('scan-banner').classList.add('hidden');
      document.getElementById('hud-header').classList.remove('hidden');

      startGame();
    }

    function buildEnvironment() {
      const groundEl = document.getElementById('game-ground');

      holePositions.forEach((pos, idx) => {
        // Contenedor del Hoyo
        const holeContainer = document.createElement('a-entity');
        holeContainer.setAttribute('position', `${pos.x} 0.001 ${pos.z}`);

        // Borde del Hoyo (Tierra)
        const ring = document.createElement('a-ring');
        ring.setAttribute('radius-inner', '0.13');
        ring.setAttribute('radius-outer', '0.17');
        ring.setAttribute('rotation', '-90 0 0');
        ring.setAttribute('color', '#5c4033');
        ring.setAttribute('material', 'roughness: 0.8');
        holeContainer.appendChild(ring);

        // Fondo del Hoyo Oscuro
        const inner = document.createElement('a-circle');
        inner.setAttribute('radius', '0.13');
        inner.setAttribute('rotation', '-90 0 0');
        inner.setAttribute('color', '#0f0a06');
        inner.setAttribute('position', '0 -0.001 0');
        holeContainer.appendChild(inner);

        groundEl.appendChild(holeContainer);

        const isActive = idx < 3;
        if (!isActive) holeContainer.setAttribute('visible', 'false');

        holesEntities.push({
          entity: holeContainer,
          active: isActive,
          pos: pos
        });
      });
    }

    // Crear Entidad Topo Kawaii 3D
    function createMoleEntity() {
      const moleGroup = document.createElement('a-entity');

      // Cuerpo café cálido (#8b5a2b)
      const body = document.createElement('a-sphere');
      body.setAttribute('radius', '0.12');
      body.setAttribute('scale', '1 1.15 0.95');
      body.setAttribute('color', '#8b5a2b');
      body.setAttribute('position', '0 0.12 0');
      moleGroup.appendChild(body);

      // Hocico beige (#f5e0c3)
      const snout = document.createElement('a-sphere');
      snout.setAttribute('radius', '0.06');
      snout.setAttribute('scale', '1 0.75 1.2');
      snout.setAttribute('color', '#f5e0c3');
      snout.setAttribute('position', '0 0.1 0.07');
      moleGroup.appendChild(snout);

      // Nariz rosa (#f48fb1)
      const nose = document.createElement('a-sphere');
      nose.setAttribute('radius', '0.02');
      nose.setAttribute('color', '#f48fb1');
      nose.setAttribute('position', '0 0.12 0.13');
      moleGroup.appendChild(nose);

      // Ojos Negros con Destellos
      [-0.045, 0.045].forEach(x => {
        const eye = document.createElement('a-sphere');
        eye.setAttribute('radius', '0.018');
        eye.setAttribute('color', '#111111');
        eye.setAttribute('position', `${x} 0.16 0.09`);
        moleGroup.appendChild(eye);

        const shine = document.createElement('a-sphere');
        shine.setAttribute('radius', '0.006');
        shine.setAttribute('color', '#ffffff');
        shine.setAttribute('position', `${x + 0.003} 0.165 0.105`);
        moleGroup.appendChild(shine);
      });

      // Casquito Amarillo (#facc15)
      const helmet = document.createElement('a-sphere');
      helmet.setAttribute('radius', '0.11');
      helmet.setAttribute('theta-length', '90');
      helmet.setAttribute('color', '#facc15');
      helmet.setAttribute('position', '0 0.13 0');
      helmet.setAttribute('rotation', '-10 0 0');
      moleGroup.appendChild(helmet);

      // Manitas apoyadas
      [-0.09, 0.09].forEach(x => {
        const hand = document.createElement('a-sphere');
        hand.setAttribute('radius', '0.028');
        hand.setAttribute('scale', '1.2 0.6 1');
        hand.setAttribute('color', '#f5e0c3');
        hand.setAttribute('position', `${x} 0.03 0.08`);
        moleGroup.appendChild(hand);
      });

      // Malla Invisible Interactiva para Click / Tap Preciso
      const hitBox = document.createElement('a-box');
      hitBox.setAttribute('width', '0.25');
      hitBox.setAttribute('height', '0.35');
      hitBox.setAttribute('depth', '0.25');
      hitBox.setAttribute('position', '0 0.15 0');
      hitBox.setAttribute('visible', 'false');
      hitBox.setAttribute('class', 'clickable');
      moleGroup.appendChild(hitBox);

      return { moleGroup, hitBox };
    }

    // Crear Entidad Bomba 3D
    function createBombEntity() {
      const bombGroup = document.createElement('a-entity');

      // Cuerpo Negro Mate (#111827)
      const body = document.createElement('a-sphere');
      body.setAttribute('radius', '0.11');
      body.setAttribute('color', '#111827');
      body.setAttribute('position', '0 0.11 0');
      bombGroup.appendChild(body);

      // Mecha
      const fuse = document.createElement('a-cylinder');
      fuse.setAttribute('radius', '0.008');
      fuse.setAttribute('height', '0.06');
      fuse.setAttribute('color', '#d4a373');
      fuse.setAttribute('position', '0 0.22 0');
      fuse.setAttribute('rotation', '0 0 15');
      bombGroup.appendChild(fuse);

      // Chispa encendida (#f59e0b)
      const spark = document.createElement('a-sphere');
      spark.setAttribute('radius', '0.02');
      spark.setAttribute('color', '#f59e0b');
      spark.setAttribute('position', '0.02 0.25 0');
      bombGroup.appendChild(spark);

      // Malla HitBox
      const hitBox = document.createElement('a-box');
      hitBox.setAttribute('width', '0.25');
      hitBox.setAttribute('height', '0.35');
      hitBox.setAttribute('depth', '0.25');
      hitBox.setAttribute('position', '0 0.15 0');
      hitBox.setAttribute('visible', 'false');
      hitBox.setAttribute('class', 'clickable');
      bombGroup.appendChild(hitBox);

      return { bombGroup, hitBox };
    }

    function startGame() {
      score = 0; level = 1; timeLeft = 30; gameActive = true;

      document.getElementById('score-val').innerText = score;
      document.getElementById('level-val').innerText = level;
      document.getElementById('time-val').innerText = `${timeLeft}s`;
      document.getElementById('gameover-modal').classList.add('hidden');

      holesEntities.forEach((h, idx) => {
        h.active = idx < 3;
        h.entity.setAttribute('visible', idx < 3 ? 'true' : 'false');
      });

      const groundEl = document.getElementById('game-ground');
      activeElements.forEach(el => groundEl.removeChild(el.group));
      activeElements = [];

      clearInterval(gameTimerInterval);
      gameTimerInterval = setInterval(() => {
        if (!gameActive) return;
        timeLeft--;
        document.getElementById('time-val').innerText = `${timeLeft}s`;
        if (timeLeft <= 0) endGame();
      }, 1000);

      scheduleNextSpawn();
    }

    function scheduleNextSpawn() {
      if (!gameActive) return;
      const delay = Math.max(600, 1500 - level * 150);
      spawnTimeout = setTimeout(() => {
        spawnElement();
        scheduleNextSpawn();
      }, delay);
    }

    function spawnElement() {
      const availableHoles = holesEntities
        .map((h, idx) => ({ h, idx }))
        .filter(item => item.h.active && !activeElements.some(el => el.holeIdx === item.idx));

      if (availableHoles.length === 0) return;

      const selected = availableHoles[Math.floor(Math.random() * availableHoles.length)];
      const isBomb = Math.random() < 0.25;

      const { moleGroup: group, hitBox } = isBomb ? createBombEntity() : createMoleEntity();
      const pos = selected.h.pos;
      
      // Inicia 100% oculto debajo del hoyo
      group.setAttribute('position', `${pos.x} -0.35 ${pos.z}`);

      const groundEl = document.getElementById('game-ground');
      groundEl.appendChild(group);

      sound.playPop();

      const elementData = {
        group: group,
        hitBox: hitBox,
        type: isBomb ? 'bomb' : 'mole',
        holeIdx: selected.idx,
        state: 'rising',
        progress: 0,
        posX: pos.x,
        posZ: pos.z
      };

      // Evento de Toque / Click directo
      hitBox.addEventListener('click', (evt) => {
        evt.stopPropagation();
        if (!gameActive) return;

        const screenX = evt.detail.intersection ? evt.detail.intersection.point.x : window.innerWidth / 2;
        const screenY = evt.detail.intersection ? evt.detail.intersection.point.y : window.innerHeight / 2;

        if (elementData.type === 'mole') {
          sound.playHit();
          score += 100;
          showPopup('+100', screenX, screenY, '#4ade80');
          checkLevelProgress();
        } else {
          sound.playExplosion();
          score = Math.max(0, score - 150);
          timeLeft = Math.max(0, timeLeft - 3);
          showPopup('-150', screenX, screenY, '#f87171');
        }

        document.getElementById('score-val').innerText = score;
        document.getElementById('time-val').innerText = `${timeLeft}s`;

        // Eliminar del terreno
        const index = activeElements.indexOf(elementData);
        if (index > -1) {
          activeElements.splice(index, 1);
          groundEl.removeChild(group);
        }
      });

      activeElements.push(elementData);
      animateElement(elementData);
    }

    // Animación Progresiva (Subida y Bajada Suave)
    function animateElement(el) {
      if (!gameActive || !activeElements.includes(el)) return;

      const groundEl = document.getElementById('game-ground');

      if (el.state === 'rising') {
        el.progress += 0.08;
        const currentY = -0.35 + (0.35 * el.progress);
        el.group.setAttribute('position', `${el.posX} ${currentY} ${el.posZ}`);

        if (el.progress >= 1) {
          el.state = 'waiting';
          setTimeout(() => {
            el.state = 'lowering';
            el.progress = 0;
            animateElement(el);
          }, Math.max(400, 1000 - level * 100));
        } else {
          requestAnimationFrame(() => animateElement(el));
        }
      } else if (el.state === 'lowering') {
        el.progress += 0.08;
        const currentY = 0 - (0.35 * el.progress);
        el.group.setAttribute('position', `${el.posX} ${currentY} ${el.posZ}`);

        if (el.progress >= 1) {
          const index = activeElements.indexOf(el);
          if (index > -1) {
            activeElements.splice(index, 1);
            groundEl.removeChild(el.group);
          }
        } else {
          requestAnimationFrame(() => animateElement(el));
        }
      }
    }

    function checkLevelProgress() {
      const newLevel = Math.floor(score / 400) + 1;
      if (newLevel > level && newLevel <= 4) {
        level = newLevel;
        document.getElementById('level-val').innerText = level;
        sound.playLevelUp();

        const inactiveHole = holesEntities.find(h => !h.active);
        if (inactiveHole) {
          inactiveHole.active = true;
          inactiveHole.entity.setAttribute('visible', 'true');
        }
      }
    }

    function showPopup(text, x, y, color) {
      const pop = document.createElement('div');
      pop.className = 'score-popup';
      pop.innerText = text;
      pop.style.left = `${window.innerWidth / 2 - 30}px`;
      pop.style.top = `${window.innerHeight / 2 - 30}px`;
      pop.style.color = color;
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 800);
    }

    function resetPlacement() {
      isPlaced = false;
      gameActive = false;
      document.getElementById('game-ground').setAttribute('visible', 'false');
      document.getElementById('gameover-modal').classList.add('hidden');
      document.getElementById('hud-header').classList.add('hidden');
      document.getElementById('scan-banner').classList.remove('hidden');
    }

    function endGame() {
      gameActive = false;
      clearInterval(gameTimerInterval);
      clearTimeout(spawnTimeout);

      document.getElementById('final-score').innerText = score;
      document.getElementById('gameover-modal').classList.remove('hidden');
    }
  </script>
</body>
</html>
